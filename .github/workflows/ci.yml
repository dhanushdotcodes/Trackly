name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web - lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  server:
    name: Server - ruff, mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install deps
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .

  status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [web, server]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.web.result }}" != "success" ] || [ "${{ needs.server.result }}" != "success" ]; then
            exit 1
          fi